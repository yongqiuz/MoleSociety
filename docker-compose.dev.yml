services:
  postgres:
    image: postgres:16-alpine
    container_name: molesociety-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: molesociety_dev
      POSTGRES_USER: molesociety
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molesociety -d molesociety_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: molesociety-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data

  backend:
    build:
      context: ./backend
    container_name: molesociety-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: development
      SERVER_PORT: 8080
      DATABASE_URL: postgres://molesociety:${POSTGRES_PASSWORD}@postgres:5432/molesociety_dev?sslmode=disable
      REDIS_ADDR: redis:6379
      DB_MIGRATIONS_DIR: ./migrations
      SOCIAL_SEED: "0"
      NEWS_AUTO_ENABLED: ${NEWS_AUTO_ENABLED:-1}
      NEWS_PULL_MINUTES: ${NEWS_PULL_MINUTES:-30}
      NEWS_INITIAL_DELAY_SECONDS: ${NEWS_INITIAL_DELAY_SECONDS:-10}
      NEWS_MAX_ITEMS_PER_RUN: ${NEWS_MAX_ITEMS_PER_RUN:-6}
      NEWS_FEED_URLS: ${NEWS_FEED_URLS:-}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "None"
    ports:
      - "8081:8080"

volumes:
  postgres_data_dev:
  redis_data_dev:
